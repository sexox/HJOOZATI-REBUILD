
name: HJOOZATI Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HJOOZATI-Android-Source.zip'
      - '.github/workflows/HJOOZATI-build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip HJOOZATI-Android-Source.zip -d extracted

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project settings.gradle.kts not found"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HJOOZATI-APK
          path: extracted/HJOOZATI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
